name: Hourly channel post

on:
  schedule:
    # Runs at minute 7 of every hour (avoids the exact-hour pile-up on GitHub's
    # scheduler, which can delay :00 runs).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "single = post just the next row to every configured channel (normal). all = fire every remaining row right now, back to back, then resume hourly."
        required: false
        default: "single"
        type: choice
        options:
          - single
          - all

permissions:
  contents: write

concurrency:
  group: hourly-discord-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Post message(s) + image(s) to Discord + Telegram
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_MODE: ${{ github.event.inputs.mode || 'single' }}
        run: python scripts/post_to_channels.py

      - name: Commit updated pointer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json last_run_error.json 2>/dev/null || git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: advance post pointer [skip ci]"
            git push
          else
            echo "Nothing to commit"
          fi
